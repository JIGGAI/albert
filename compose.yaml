name: albert

x-albert-build: &albert-build
  context: .
  args:
    ALBERT_INSTALL_SEMANTIC: ${ALBERT_INSTALL_SEMANTIC:-false}

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: albert
      POSTGRES_USER: albert
      POSTGRES_PASSWORD: ${ALBERT_POSTGRES_PASSWORD:?set ALBERT_POSTGRES_PASSWORD}
    volumes:
      - albert-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albert -d albert"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Only started with `--profile falkordb`, for ALBERT_GRAPH_STORE=falkordb.
  falkordb:
    image: falkordb/falkordb:6.0.1
    profiles: ["falkordb"]
    volumes:
      - albert-falkordb:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Only started with `--profile neo4j`, for ALBERT_GRAPH_STORE=neo4j.
  neo4j:
    image: neo4j:5.26-community
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: neo4j/${ALBERT_NEO4J_PASSWORD:-}
      NEO4J_server_memory_heap_max__size: ${ALBERT_NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${ALBERT_NEO4J_PAGECACHE:-256m}
    volumes:
      - albert-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  migrate:
    build: *albert-build
    environment: &albert-env
      ALBERT_DATABASE_URL: postgresql+psycopg://albert:${ALBERT_POSTGRES_PASSWORD:?set ALBERT_POSTGRES_PASSWORD}@db:5432/albert
      ALBERT_API_KEY_PEPPER: ${ALBERT_API_KEY_PEPPER:?set ALBERT_API_KEY_PEPPER}
      ALBERT_EMBEDDING_PROVIDER: ${ALBERT_EMBEDDING_PROVIDER:-hashing}
      ALBERT_EMBEDDING_DIMENSIONS: ${ALBERT_EMBEDDING_DIMENSIONS:-384}
      ALBERT_EMBEDDING_MODEL: ${ALBERT_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      ALBERT_EMBEDDING_REQUEST_DIMENSIONS: ${ALBERT_EMBEDDING_REQUEST_DIMENSIONS:-false}
      ALBERT_GRAPH_STORE: ${ALBERT_GRAPH_STORE:-postgres}
      ALBERT_FALKORDB_URL: ${ALBERT_FALKORDB_URL:-redis://falkordb:6379}
      ALBERT_NEO4J_URL: ${ALBERT_NEO4J_URL:-bolt://neo4j:7687}
      ALBERT_NEO4J_PASSWORD: ${ALBERT_NEO4J_PASSWORD:-}
      ALBERT_LLM_PROVIDER: ${ALBERT_LLM_PROVIDER:-none}
      ALBERT_OPENAI_BASE_URL: ${ALBERT_OPENAI_BASE_URL:-https://api.openai.com/v1}
      ALBERT_OPENAI_API_KEY: ${ALBERT_OPENAI_API_KEY:-}
      ALBERT_CLASSIFICATION_MODEL: ${ALBERT_CLASSIFICATION_MODEL:-}
      ALBERT_MIN_VECTOR_SIMILARITY: ${ALBERT_MIN_VECTOR_SIMILARITY:-0.2}
      ALBERT_TRACE_SAMPLE_RATE: ${ALBERT_TRACE_SAMPLE_RATE:-1.0}
      ALBERT_TRACE_RETENTION_DAYS: ${ALBERT_TRACE_RETENTION_DAYS:-14}
      HF_HOME: /var/cache/albert-models
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  runtime-check:
    build: *albert-build
    environment: *albert-env
    command: ["albert-admin", "validate-runtime", "--probe-embedding"]
    volumes:
      - albert-model-cache:/var/cache/albert-models
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: *albert-build
    environment: *albert-env
    volumes:
      - albert-model-cache:/var/cache/albert-models
    ports:
      - "${ALBERT_API_BIND:-127.0.0.1}:${ALBERT_API_PORT:-8080}:8080"
    depends_on:
      runtime-check:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build: *albert-build
    environment: *albert-env
    command: ["albert-worker"]
    volumes:
      - albert-model-cache:/var/cache/albert-models
    depends_on:
      runtime-check:
        condition: service_completed_successfully
    restart: unless-stopped

  mcp:
    build: *albert-build
    environment:
      ALBERT_API_URL: http://api:8080
    command: ["albert-mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "${ALBERT_MCP_BIND:-127.0.0.1}:${ALBERT_MCP_PORT:-8081}:8081"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  console:
    build: ./console
    environment:
      ALBERT_API_URL: http://api:8080
      # Optional at parse time: the key can only be issued once the API is up, so a
      # first `docker compose up` must work without it. The console shows an
      # authentication error until the key is set and the service is recreated.
      ALBERT_CONSOLE_API_KEY: ${ALBERT_CONSOLE_API_KEY:-}
    ports:
      - "${ALBERT_CONSOLE_BIND:-127.0.0.1}:${ALBERT_CONSOLE_PORT:-8082}:8082"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  albert-falkordb:
  albert-neo4j:
  albert-postgres:
  albert-model-cache:
