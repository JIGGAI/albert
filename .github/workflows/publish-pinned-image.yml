name: Publish pinned Albert image

on:
  push:
    branches: [ops/publish-pinned-image]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pinned Albert source
        uses: actions/checkout@v4
        with:
          ref: 3e31ce8a09d9620937271c0a10728dfd0891d8d1

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable source tag
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jiggai/albert:0.4-3e31ce8
          labels: org.opencontainers.image.revision=3e31ce8a09d9620937271c0a10728dfd0891d8d1

      - name: Record digest-qualified image
        run: echo 'ghcr.io/jiggai/albert@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
