name: Publish pinned Albert image

on:
  push:
    branches: [ops/publish-albert-605ccedf-v2]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact merged Albert source
        uses: actions/checkout@v4
        with:
          ref: 605ccedf441381ef87af3b399bdd7302b0a7de36

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable revision tag
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jiggai/albert:sha-605ccedf441381ef87af3b399bdd7302b0a7de36
          labels: org.opencontainers.image.revision=605ccedf441381ef87af3b399bdd7302b0a7de36

      - name: Record digest-qualified image
        run: echo 'ghcr.io/jiggai/albert@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
