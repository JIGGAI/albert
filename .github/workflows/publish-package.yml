name: Prepare or release albert-memory to PyPI
run-name: Prepare or release albert-memory v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to prepare or release (for example, 0.4.1)"
        required: true
        type: string

concurrency:
  group: albert-memory-pypi-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      release_ready: ${{ steps.version.outputs.release_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install version tooling
        run: python -m pip install --constraint constraints.txt packaging
      - name: Prepare or validate the requested package version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Run this workflow from the main branch." >&2
            exit 1
          }

          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          normalized_version=$(python -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' "$RELEASE_VERSION")
          test "$RELEASE_VERSION" = "$normalized_version" || {
            echo "Version must use its normalized PEP 440 form: $normalized_version" >&2
            exit 1
          }

          if test "$RELEASE_VERSION" = "$package_version"; then
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
            echo "Version $RELEASE_VERSION is already reviewed on main; continuing to publication."
          else
            python scripts/bump-package-version.py "$RELEASE_VERSION"
            python scripts/openclaw-package-contract.py source
            python scripts/claude-package-contract.py source
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit the version bump and open its review PR
        if: steps.version.outputs.release_ready == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          title="chore: bump albert-memory to $RELEASE_VERSION"
          existing_pr=$(gh pr list --base main --state open --search "$title in:title" \
            --json url --jq '.[0].url')
          if test -n "$existing_pr"; then
            echo "An open version-bump PR already exists: $existing_pr"
            {
              echo "### Version bump already prepared"
              echo
              echo "Merge $existing_pr, then run this action again for $RELEASE_VERSION to publish."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          release_branch="release/albert-memory-v$RELEASE_VERSION-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$release_branch"
          git add -u
          git commit -m "$title"
          git push origin "HEAD:refs/heads/$release_branch"
          pr_url=$(gh pr create --base main --head "$release_branch" --title "$title" \
            --body "Prepared by the PyPI release action. Merge after CI passes, then run the action again for version $RELEASE_VERSION to publish the reviewed main revision.")
          gh workflow run ci.yml --ref "$release_branch"
          {
            echo "### Version bump prepared"
            echo
            echo "Merge $pr_url after CI passes, then run this action again for $RELEASE_VERSION to publish."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: prepare
    if: needs.prepare.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: python -m pip install --constraint constraints.txt build
      - name: Require a green main revision and matching package version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: albert-memory-v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Run this workflow from the main branch." >&2
            exit 1
          }

          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          normalized_version=$(python -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' "$RELEASE_VERSION")
          test "$RELEASE_VERSION" = "$normalized_version" || {
            echo "Version must use its normalized PEP 440 form: $normalized_version" >&2
            exit 1
          }
          test "$RELEASE_VERSION" = "$package_version" || {
            echo "Requested version $RELEASE_VERSION does not match pyproject.toml version $package_version." >&2
            echo "Bump and review the package version in a normal PR before releasing." >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}" 2>/dev/null)" = "$GITHUB_SHA" || {
              echo "The selected revision is no longer current on main and has no matching release tag." >&2
              exit 1
            }
            echo "Continuing a previously tagged release after main advanced."
          fi

          ci_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --commit "$GITHUB_SHA" --event push --limit 10 \
            --json conclusion,status,url \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")][0].url')
          test -n "$ci_run" || {
            echo "No successful main CI run exists for $GITHUB_SHA." >&2
            exit 1
          }
          echo "Releasing the revision proven by $ci_run"
          python scripts/openclaw-package-contract.py source
      - name: Build exact wheel and provenance
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          python -m build --wheel
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          python scripts/openclaw-package-contract.py emit "$wheel" \
            --source-revision "$GITHUB_SHA" --output openclaw-package-provenance.json
          python scripts/openclaw-package-contract.py verify \
            "$wheel" openclaw-package-provenance.json
      - name: Refuse an existing PyPI version with different bytes
        id: pypi
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          wheel = next(Path("dist").glob("*.whl"))
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          try:
              with urllib.request.urlopen(
                  f"https://pypi.org/pypi/albert-memory/{version}/json", timeout=30
              ) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              print("needs_publish=true")
          else:
              matches = [item for item in release["urls"] if item["filename"] == wheel.name]
              if len(matches) != 1 or matches[0]["digests"]["sha256"] != digest:
                  raise SystemExit(
                      f"PyPI already has {version}, but its wheel does not match this build"
                  )
              print("needs_publish=false")
          PY
      - name: Create the immutable tag and draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: albert-memory-v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse --verify --quiet "$RELEASE_TAG^{commit}" >/dev/null; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA" || {
              echo "$RELEASE_TAG already points to a different revision." >&2
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "albert-memory $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          if release=$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null); then
            test "$(jq -r .isDraft <<< "$release")" = "true" || {
              echo "GitHub release $RELEASE_TAG is already published." >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" --clobber \
              dist/*.whl openclaw-package-provenance.json
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes \
              --title "albert-memory $RELEASE_VERSION" \
              dist/*.whl openclaw-package-provenance.json
          fi
      - name: Attest the immutable wheel
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl
      - name: Publish immutable version to PyPI with attestations
        if: steps.pypi.outputs.needs_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: albert-memory-v${{ inputs.version }}
        run: gh release edit "$RELEASE_TAG" --draft=false
