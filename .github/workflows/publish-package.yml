name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  openclaw-package:
    if: startsWith(github.event.release.tag_name, 'albert-memory-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --constraint constraints.txt build
      - name: Require the immutable tag to match package metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "albert-memory-v$version"
          python scripts/openclaw-package-contract.py source
      - name: Build exact wheel and provenance
        run: |
          python -m build --wheel
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          python scripts/openclaw-package-contract.py emit "$wheel" \
            --source-revision "$GITHUB_SHA" --output openclaw-package-provenance.json
          python scripts/openclaw-package-contract.py verify \
            "$wheel" openclaw-package-provenance.json
      - name: Attest the immutable wheel
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl
      - name: Publish immutable version to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true
      - name: Attach digest-pinned provenance to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" openclaw-package-provenance.json
