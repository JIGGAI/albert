name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: albert
          POSTGRES_USER: albert
          POSTGRES_PASSWORD: albert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U albert -d albert"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      falkordb:
        image: falkordb/falkordb:6.0.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --constraint constraints.txt -e '.[dev]'
      - run: ruff check .
      - name: Validate OpenClaw package source contract
        run: python scripts/openclaw-package-contract.py source
      - name: Build and verify the OpenClaw wheel contract
        run: |
          python -m build --wheel
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          python scripts/openclaw-package-contract.py emit "$wheel" \
            --source-revision "$GITHUB_SHA" --output dist/openclaw-package-provenance.json
          python scripts/openclaw-package-contract.py verify \
            "$wheel" dist/openclaw-package-provenance.json
      - name: Enforce public retrieval and safety benchmark thresholds
        run: python scripts/run-public-benchmark.py --output benchmark-results
      - name: Upload benchmark reproducibility receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-retrieval-safety-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results
          if-no-files-found: error
      - name: Test (the graph store contract also runs against FalkorDB and Neo4j)
        env:
          ALBERT_TEST_FALKORDB_URL: redis://127.0.0.1:6379
          ALBERT_TEST_NEO4J_URL: bolt://127.0.0.1:7687
          ALBERT_TEST_NEO4J_PASSWORD: ci-neo4j-password
        run: pytest --cov=albert --cov-report=term-missing
      - name: Validate Compose configuration
        env:
          ALBERT_API_KEY_PEPPER: ci-pepper-that-is-longer-than-thirty-two-characters
          ALBERT_POSTGRES_PASSWORD: ci-database-password
        run: docker compose config --quiet
      - name: Build both production image variants from this revision
        run: |
          docker build --tag albert-memory:ci .
          docker build --build-arg ALBERT_INSTALL_SEMANTIC=true --tag albert-memory-semantic:ci .
      - name: Verify revision-matched image compatibility manifests
        run: |
          docker run --rm --entrypoint albert-admin albert-memory:ci compat --json > "$RUNNER_TEMP/compat.json"
          docker run --rm --entrypoint albert-admin albert-memory-semantic:ci compat --json > "$RUNNER_TEMP/compat-semantic.json"
          python -m json.tool "$RUNNER_TEMP/compat.json"
          cmp "$RUNNER_TEMP/compat.json" "$RUNNER_TEMP/compat-semantic.json"
          python -c "import json, os; m = json.load(open(os.path.join(os.environ['RUNNER_TEMP'], 'compat.json'))); assert m['migrations']['heads'], m; assert set(m['migrations']['heads']) <= set(m['migrations']['known_revisions']), m"
      - name: Verify PostgreSQL migration
        env:
          ALBERT_DATABASE_URL: postgresql+psycopg://albert:albert@127.0.0.1:5432/albert
          ALBERT_API_KEY_PEPPER: ci-pepper-that-is-longer-than-thirty-two-characters
        run: alembic upgrade head
      - name: Verify migration is current
        env:
          ALBERT_DATABASE_URL: postgresql+psycopg://albert:albert@127.0.0.1:5432/albert
          ALBERT_API_KEY_PEPPER: ci-pepper-that-is-longer-than-thirty-two-characters
        run: alembic check
      - name: Exercise PostgreSQL vector and graph paths
        env:
          ALBERT_DATABASE_URL: postgresql+psycopg://albert:albert@127.0.0.1:5432/albert
          ALBERT_API_KEY_PEPPER: ci-pepper-that-is-longer-than-thirty-two-characters
          ALBERT_EMBEDDING_PROVIDER: hashing
          ALBERT_EMBEDDING_DIMENSIONS: "384"
        run: python scripts/postgres-smoke.py

  console:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv .venv && .venv/bin/pip install --constraint constraints.txt -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: cd console && npm ci && npm run lint && npm run typecheck && npm run build
      - run: cd console && npx playwright install --with-deps chromium
      - name: Console end-to-end against a SQLite API
        run: sh console/e2e/run.sh
      - name: Upload console failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            console/playwright-report
            console/test-results
          if-no-files-found: warn
      - run: docker build --tag albert-console:ci console

  publish:
    # PR checkout is GitHub's synthetic merge commit, not the source branch.
    # Its tree-addressed tag is the hand-off from tested candidate to main.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    needs: [test, console]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      standard_digest: ${{ steps.standard.outputs.digest }}
      semantic_digest: ${{ steps.semantic.outputs.digest }}
      tree: ${{ steps.candidate.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record tested merge-tree identity
        id: candidate
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          base=${PR_BASE:-$QUEUE_BASE}
          source=${PR_HEAD:-$QUEUE_HEAD}
          test -n "$base" && test -n "$source"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested standard merge-tree candidate
        id: standard
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/jiggai/albert:candidate-tree-${{ steps.candidate.outputs.tree }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.albert.provenance.source-head=${{ steps.candidate.outputs.source }}
            io.albert.provenance.base-revision=${{ steps.candidate.outputs.base }}
            io.albert.provenance.tree=${{ steps.candidate.outputs.tree }}
            io.albert.provenance.ci-run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Publish tested semantic merge-tree candidate
        id: semantic
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          sbom: true
          provenance: mode=max
          build-args: ALBERT_INSTALL_SEMANTIC=true
          tags: ghcr.io/jiggai/albert-semantic:candidate-tree-${{ steps.candidate.outputs.tree }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.albert.provenance.source-head=${{ steps.candidate.outputs.source }}
            io.albert.provenance.base-revision=${{ steps.candidate.outputs.base }}
            io.albert.provenance.tree=${{ steps.candidate.outputs.tree }}
            io.albert.provenance.ci-run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Verify candidates and write signed release-bundle manifest
        env:
          STANDARD_DIGEST: ${{ steps.standard.outputs.digest }}
          SEMANTIC_DIGEST: ${{ steps.semantic.outputs.digest }}
          TREE: ${{ steps.candidate.outputs.tree }}
        run: |
          docker run --rm --entrypoint albert-admin "ghcr.io/jiggai/albert@$STANDARD_DIGEST" compat --json > compat-standard.json
          docker run --rm --entrypoint albert-admin "ghcr.io/jiggai/albert-semantic@$SEMANTIC_DIGEST" compat --json > compat-semantic.json
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "ghcr.io/jiggai/albert@$STANDARD_DIGEST")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "ghcr.io/jiggai/albert-semantic@$SEMANTIC_DIGEST")" = "$GITHUB_SHA"
          scripts/release-bundle.py emit --revision "$GITHUB_SHA" --tree "$TREE" \
            --standard-digest "$STANDARD_DIGEST" --semantic-digest "$SEMANTIC_DIGEST" \
            --standard-compat compat-standard.json --semantic-compat compat-semantic.json \
            --ci-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output release-bundle.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ steps.candidate.outputs.tree }}
          path: release-bundle.json
          if-no-files-found: error
      - name: Attest standard candidate image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/jiggai/albert
          subject-digest: ${{ steps.standard.outputs.digest }}
          push-to-registry: true
      - name: Attest semantic candidate image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/jiggai/albert-semantic
          subject-digest: ${{ steps.semantic.outputs.digest }}
          push-to-registry: true
      - name: Sign the versioned release-bundle manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-bundle.json

  release:
    # Main publishes both lanes from the same checked-out revision. Each lane
    # keeps its own digest so Cloud can roll it back independently.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test, console]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record release tree
        id: source
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Publish standard release image
        id: standard
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/jiggai/albert:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.albert.provenance.source-head=${{ github.sha }}
            io.albert.provenance.tree=${{ steps.source.outputs.tree }}
            io.albert.provenance.ci-run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Publish semantic release image
        id: semantic
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          sbom: true
          provenance: mode=max
          build-args: ALBERT_INSTALL_SEMANTIC=true
          tags: ghcr.io/jiggai/albert-semantic:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.albert.provenance.source-head=${{ github.sha }}
            io.albert.provenance.tree=${{ steps.source.outputs.tree }}
            io.albert.provenance.ci-run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Verify release images and write bundle
        env:
          STANDARD_DIGEST: ${{ steps.standard.outputs.digest }}
          SEMANTIC_DIGEST: ${{ steps.semantic.outputs.digest }}
          TREE: ${{ steps.source.outputs.tree }}
        run: |
          docker run --rm --entrypoint albert-admin "ghcr.io/jiggai/albert@$STANDARD_DIGEST" compat --json > compat-standard.json
          docker run --rm --entrypoint albert-admin "ghcr.io/jiggai/albert-semantic@$SEMANTIC_DIGEST" compat --json > compat-semantic.json
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "ghcr.io/jiggai/albert@$STANDARD_DIGEST")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "ghcr.io/jiggai/albert-semantic@$SEMANTIC_DIGEST")" = "$GITHUB_SHA"
          scripts/release-bundle.py emit --revision "$GITHUB_SHA" --tree "$TREE" \
            --standard-digest "$STANDARD_DIGEST" --semantic-digest "$SEMANTIC_DIGEST" \
            --standard-compat compat-standard.json --semantic-compat compat-semantic.json \
            --ci-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output release-bundle.json
          scripts/release-bundle.py verify release-bundle.json --revision "$GITHUB_SHA" --tree "$TREE"
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle.json
          if-no-files-found: error
      - name: Attest standard release image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/jiggai/albert
          subject-digest: ${{ steps.standard.outputs.digest }}
          push-to-registry: true
      - name: Attest semantic release image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/jiggai/albert-semantic
          subject-digest: ${{ steps.semantic.outputs.digest }}
          push-to-registry: true
      - name: Sign the versioned release-bundle manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-bundle.json
