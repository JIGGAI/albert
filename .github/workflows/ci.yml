name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: albert
          POSTGRES_USER: albert
          POSTGRES_PASSWORD: albert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U albert -d albert"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --constraint constraints.txt -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=albert --cov-report=term-missing
      - name: Validate Compose configuration
        env:
          ALBERT_API_KEY_PEPPER: ci-pepper-that-is-longer-than-thirty-two-characters
          ALBERT_POSTGRES_PASSWORD: ci-database-password
          ALBERT_CONSOLE_API_KEY: ci-console-key-placeholder
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --tag albert-memory:ci .
      - name: Verify PostgreSQL migration
        env:
          ALBERT_DATABASE_URL: postgresql+psycopg://albert:albert@127.0.0.1:5432/albert
          ALBERT_API_KEY_PEPPER: ci-pepper-that-is-longer-than-thirty-two-characters
        run: alembic upgrade head
      - name: Verify migration is current
        env:
          ALBERT_DATABASE_URL: postgresql+psycopg://albert:albert@127.0.0.1:5432/albert
          ALBERT_API_KEY_PEPPER: ci-pepper-that-is-longer-than-thirty-two-characters
        run: alembic check
      - name: Exercise PostgreSQL vector and graph paths
        env:
          ALBERT_DATABASE_URL: postgresql+psycopg://albert:albert@127.0.0.1:5432/albert
          ALBERT_API_KEY_PEPPER: ci-pepper-that-is-longer-than-thirty-two-characters
          ALBERT_EMBEDDING_PROVIDER: hashing
          ALBERT_EMBEDDING_DIMENSIONS: "384"
        run: python scripts/postgres-smoke.py

  console:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m venv .venv && .venv/bin/pip install --constraint constraints.txt -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: cd console && npm ci && npm run lint && npm run typecheck && npm run build
      - run: cd console && npx playwright install --with-deps chromium
      - name: Console end-to-end against a SQLite API
        run: sh console/e2e/run.sh
      - run: docker build --tag albert-console:ci console
